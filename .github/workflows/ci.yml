name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  advisory-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn when the advisory data is older than 30 days
        run: |
          rev=$(grep -oE '"revision": "[0-9-]+"' internal/advisory/advisory.json | cut -d'"' -f4)
          age=$(( ( $(date +%s) - $(date -d "$rev" +%s) ) / 86400 ))
          echo "advisory revision $rev is $age days old"
          if [ "$age" -gt 30 ]; then echo "::warning::advisory data is $age days old; check for new PHP releases"; fi
